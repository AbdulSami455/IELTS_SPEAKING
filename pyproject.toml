[project]
name = "ielts-speaking"
version = "0.1.0"
description = "IELTS-style speaking practice"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "ielts-api",
    "ielts-worker",
    "ielts-domain",
    "ielts-db",
    "ielts-config",
    "ielts-inference",
    "ielts-audio",
    "ielts-observability",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/domain",
    "packages/db",
    "packages/config",
    "packages/inference",
    "packages/audio",
    "packages/observability",
]

[tool.uv.sources]
ielts-api = { workspace = true }
ielts-worker = { workspace = true }
ielts-domain = { workspace = true }
ielts-db = { workspace = true }
ielts-config = { workspace = true }
ielts-inference = { workspace = true }
ielts-audio = { workspace = true }
ielts-observability = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/domain/tests",
    "packages/inference/tests",
    "packages/config/tests",
    "packages/db/tests",
    "packages/observability/tests",
    "apps/api/tests",
    "apps/worker/tests",
    "evals/tests",
]
asyncio_mode = "auto"
markers = [
    "eval_live: calls real model providers; run with `make evals` (needs OPENROUTER_API_KEY)",
    "postgres: needs TEST_DATABASE_URL pointing at a disposable Postgres database",
]
addopts = "-m 'not eval_live'"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
pythonpath = [
    "packages/domain/src",
    "packages/db/src",
    "packages/config/src",
    "packages/inference/src",
    "packages/audio/src",
    "packages/observability/src",
    "apps/api/src",
    "apps/worker/src",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection relies on calls in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Body", "fastapi.Header", "fastapi.Form", "fastapi.Path", "fastapi.Security", "Depends", "Query", "File", "Body", "Header", "Form", "Path"]

[dependency-groups]
dev = [
    "pytest>=8.0",
 "pytest-asyncio>=0.24",
 "httpx>=0.27",
 "ruff>=0.9",
 "fakeredis>=2.39.0",
]
