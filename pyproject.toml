[project]
name = "ielts-speaking"
version = "0.1.0"
description = "IELTS-style speaking practice"
requires-python = ">=3.13"
dependencies = [
    "ielts-api",
    "ielts-worker",
    "ielts-domain",
    "ielts-db",
    "ielts-config",
    "ielts-inference",
    "ielts-audio",
    "ielts-observability",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/domain",
    "packages/db",
    "packages/config",
    "packages/inference",
    "packages/audio",
    "packages/observability",
]

[tool.uv.sources]
ielts-api = { workspace = true }
ielts-worker = { workspace = true }
ielts-domain = { workspace = true }
ielts-db = { workspace = true }
ielts-config = { workspace = true }
ielts-inference = { workspace = true }
ielts-audio = { workspace = true }
ielts-observability = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/domain/tests",
    "packages/inference/tests",
    "packages/config/tests",
]
pythonpath = [
    "packages/domain/src",
    "packages/db/src",
    "packages/config/src",
    "packages/inference/src",
    "packages/audio/src",
    "packages/observability/src",
    "apps/api/src",
    "apps/worker/src",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.9"]
