[project]
name = "ielts-api"
version = "0.1.0"
description = "FastAPI application for IELTS Speaking platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0",
    "email-validator>=2.0",
    "pyjwt>=2.0",
    "cryptography>=42.0",
    "ielts-domain",
    "ielts-db",
    "ielts-config",
    "ielts-inference",
    "ielts-worker",
    "ielts-observability",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
