[project]
name = "ielts-worker"
version = "0.1.0"
description = "Celery worker for IELTS Speaking platform"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "ielts-db",
    "ielts-config",
    "ielts-inference",
    "ielts-domain",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
