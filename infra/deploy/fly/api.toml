# fly launch --config infra/deploy/fly/api.toml --copy-config
app = "ielts-api"
primary_region = "lhr"

[build]
  dockerfile = "infra/Dockerfile.backend"

[env]
  APP_ENV = "production"
  AUTH_MODE = "jwt"
  PORT = "4000"
  TRUSTED_PROXY_HOPS = "1"
  AUTO_MIGRATE = "false"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    idle_timeout = 180

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  memory = "1gb"
  cpus = 1
