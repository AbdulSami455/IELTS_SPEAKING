apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ielts
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ielts-api
          args: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ielts
            - secretRef:
                name: ielts
