apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ielts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ielts-api
          args:
            [
              "celery",
              "-A",
              "ielts_worker.tasks:celery_app",
              "worker",
              "--loglevel=info",
              "--concurrency=2",
            ]
          envFrom:
            - configMapRef:
                name: ielts
            - secretRef:
                name: ielts
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
