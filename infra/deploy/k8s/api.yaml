apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ielts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ielts-api
          args:
            [
              "sh",
              "-c",
              "uvicorn ielts_api.api:app --host 0.0.0.0 --port 4000 --proxy-headers --forwarded-allow-ips='*'",
            ]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: ielts
            - secretRef:
                name: ielts
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ielts
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 4000
      targetPort: http
