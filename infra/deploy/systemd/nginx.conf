# Drop in as /etc/nginx/sites-available/ielts
# Native (non-Docker) VPS: nginx serves the Vite build and proxies /v1 to uvicorn.

upstream ielts_api {
    server 127.0.0.1:4000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name speak.example.com;

    ssl_certificate     /etc/letsencrypt/live/speak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speak.example.com/privkey.pem;

    root /opt/ielts/apps/web/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    client_max_body_size 26m;

    location /v1/ {
        proxy_pass http://ielts_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass http://ielts_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name speak.example.com;
    return 301 https://$host$request_uri;
}
