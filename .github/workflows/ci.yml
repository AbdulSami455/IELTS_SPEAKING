name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: API, worker, packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ielts
          POSTGRES_PASSWORD: ielts
          POSTGRES_DB: ielts_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ielts -d ielts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      WEB_ORIGIN: http://localhost:3000
      AUTH_MODE: jwt
      AUTH_TOKEN_SECRET: ci-only-secret-that-is-long-enough-for-hmac-0123456789abcdef
      DATABASE_URL: postgresql://ielts:ielts@localhost:5432/ielts_test
      TEST_DATABASE_URL: postgresql://ielts:ielts@localhost:5432/ielts_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio-development-only
      MINIO_CANDIDATE_BUCKET: ielts-candidate-private
      MINIO_DERIVATIVE_BUCKET: ielts-derived-private
      MINIO_EXAMINER_BUCKET: ielts-examiner-private
      OPENROUTER_API_KEY: ci-placeholder-key
      AUTO_MIGRATE: "false"
      CONSENT_VERSION: "2026-10-12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Migrations apply from empty
        run: uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q -p no:cacheprovider

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end (mocked API)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
