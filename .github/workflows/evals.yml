name: AI evals

# Nightly live run against the real providers. Needs the OPENROUTER_API_KEY secret.
# The run re-records provider responses and fails on threshold breaches; recordings
# are uploaded as an artifact so a regression can be inspected and committed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  live-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: development
      WEB_ORIGIN: http://localhost:3000
      AUTH_MODE: jwt
      AUTH_TOKEN_SECRET: evals-only-secret-that-is-long-enough-for-hmac-0123456789abcdef
      DATABASE_URL: postgresql://ielts:ielts@localhost:5432/ielts
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio-development-only
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_SCORING_MODEL: ${{ vars.OPENROUTER_SCORING_MODEL }}
      OPENROUTER_SCORING_FALLBACK_MODEL: ${{ vars.OPENROUTER_SCORING_FALLBACK_MODEL }}
      REALTIME_LLM_MODEL: ${{ vars.REALTIME_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Scoring eval
        run: uv run python evals/scoring/run.py --live --record
      - name: Examiner eval
        if: always()
        run: uv run python evals/examiner/run.py --live --record
      - name: Provider probes
        if: always()
        run: uv run python -m ielts_inference.probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-recordings
          path: |
            evals/scoring/recordings
            evals/examiner/recordings
          retention-days: 30
