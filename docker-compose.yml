services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ielts
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-development-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu

        i=0
        until mc alias set local http://minio:9000 minio minio-development-only; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then exit 1; fi
          sleep 2
        done
        mc mb -p local/ielts-candidate-private
        mc mb -p local/ielts-derived-private
        mc mb -p local/ielts-examiner-private
        mc anonymous set none local/ielts-candidate-private || true
        mc anonymous set none local/ielts-derived-private || true
        mc anonymous set none local/ielts-examiner-private || true
        echo "MinIO buckets ready"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file:
      - .env
    environment: &backend-env
      DATABASE_URL: postgresql://ielts:ielts@postgres:5432/ielts
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      WEB_ORIGIN: http://localhost:3000
      API_HOST: 0.0.0.0
      API_PORT: 4000
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONPATH: /app/apps/api/src:/app/apps/worker/src:/app/packages/domain/src:/app/packages/db/src:/app/packages/config/src:/app/packages/inference/src:/app/packages/audio/src:/app/packages/observability/src
    volumes: &backend-src
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    command:
      [
        "uvicorn",
        "ielts_api.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "4000",
        "--reload",
        "--reload-dir",
        "/app/apps",
        "--reload-dir",
        "/app/packages",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    user: "nobody:nogroup"
    env_file:
      - .env
    environment: *backend-env
    volumes: *backend-src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "celery -A ielts_worker.tasks:celery_app worker --loglevel=info --pool=solo",
        "/app/apps",
        "/app/packages",
      ]

  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./apps/web:/web
      - web_node_modules:/web/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:4000/v1
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "/web/scripts/dev-entrypoint.sh"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
