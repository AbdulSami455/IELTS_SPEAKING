[project]
name = "ielts-inference"
version = "0.1.0"
description = "Inference adapters and evaluation pipeline"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "ielts-db",
    "ielts-domain",
    "ielts-config",
    "ielts-audio",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
