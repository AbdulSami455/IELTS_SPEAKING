[project]
name = "ielts-observability"
version = "0.1.0"
description = "Structured logging and redaction"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "prometheus-client>=0.20"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
